# OpenLoader FreeBSD Configuration
# Copy this file to ~/.config/SS14.Launcher/openloader.conf

# Base directory for user data
BaseDirectory = ~/.local/share/SS14.Launcher

# Configuration directory
ConfigDirectory = ~/.config/SS14.Launcher

# Cache directory
CacheDirectory = ~/.cache/SS14.Launcher

# Enable debug logging
DebugLogging = false

# Preferred network protocol
PreferredProtocol = tcp

# Maximum download threads
MaxDownloadThreads = 4

# Enable hardware acceleration
EnableHardwareAcceleration = true

# Desktop environment detection
DesktopEnvironment = KDE

# SDL video driver (x11, wayland)
SDL_VIDEODRIVER = x11

# SDL audio driver (pulseaudio, alsa, oss)
SDL_AUDIODRIVER = pulseaudio

# Qt platform (xcb, wayland)
QT_QPA_PLATFORM = xcb

# Qt style for KDE (Breeze, Fusion, Windows)
QT_STYLE_OVERRIDE = Breeze

# Enable KDE integration
KDEIntegration = true

# Use native file dialogs
UseNativeFileDialogs = true

# Enable system tray icon
EnableSystemTray = true
